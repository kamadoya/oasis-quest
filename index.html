<style>
*{box-sizing:border-box}body{margin:0;background:#17131d;color:#fff;font-family:monospace;overflow-x:hidden}
#game{max-width:980px;margin:auto;background:#28203a;min-height:100vh;padding:10px}
h1{font-size:20px;margin:4px 0}.bar{display:flex;gap:8px;flex-wrap:wrap;background:#10172d;border:3px solid #fff;padding:7px;margin-bottom:8px}
#map{position:relative;width:704px;height:576px;max-width:100%;margin:auto;background:#69a955;border:5px solid #e8e2c8;overflow:hidden}
#tileLayer{position:absolute;inset:0;will-change:transform}.tile{position:absolute;width:64px;height:64px;border:1px solid rgba(0,0,0,.08)}
.plain{background:url("assets/grass_tile.png") center/cover}.forest{background:url("assets/forest_tile.png") center/cover}.mountain{background:url("assets/mountain_tile.png") center/cover}.water{background:url("assets/water_tile.png") center/cover}.desert{background:url("assets/desert_tile.png") center/cover}.oasis{background:url("assets/oasis_tile.png") center/cover;box-shadow:inset 0 0 0 2px #e3c66f}.village{background:url("assets/home_tile.png") center/cover}

#hero.walk{animation:bob .18s steps(2) infinite}@keyframes bob{0%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}100%{transform:translateY(0) rotate(-2deg)}}
.controls{text-align:center;margin:10px}.controls button,.cmd button{font:700 18px monospace;padding:8px 14px;margin:2px;background:#16285a;color:#fff;border:3px solid #fff;border-radius:4px}
#battle{display:none;position:fixed;inset:0;background:#15152a;z-index:50;padding:12px}
#battle.show{display:block}.battlebox{max-width:980px;height:94vh;margin:auto;position:relative;background:linear-gradient(#83c9e8 0 34%,#d8bd78 34% 70%,#5d8f57 70%);border:5px solid #fff;overflow:hidden}
#enemies{position:absolute;left:46%;right:2%;top:10%;bottom:31%;display:flex;align-items:flex-end;justify-content:space-around;gap:4px}
.enemy{position:relative;width:24%;height:70%;border:0;background:transparent;color:#fff;font:700 12px monospace;text-shadow:2px 2px #000;cursor:pointer}
.enemy img{width:100%;height:75%;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(4px 5px #60462f);overflow:visible}
.enemy.sel{outline:4px solid #fff59d;border-radius:8px}.enemy.sel:before{content:"▼";position:absolute;top:-24px;left:43%;font-size:24px}
.dead{opacity:0;transform:scale(.3);transition:.3s}.hit{animation:hit .28s steps(2)}@keyframes hit{30%{filter:brightness(3);transform:translateX(-8px)}70%{transform:translateX(8px)}}
#party{position:absolute;left:2%;top:11%;width:41%;height:56%;display:flex;align-items:flex-end;justify-content:space-around}
.actor{width:23%;height:170px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(4px 5px #544);transition:transform .16s;transform-origin:bottom center}
.actor.attack{transform:translateX(82px) translateY(-6px) scale(1.08)}.actor.hurt{animation:hit .28s steps(2)}
#ui{position:absolute;left:1%;right:1%;bottom:1%;height:28%;display:grid;grid-template-columns:1fr 2fr;gap:8px}
.panel{background:#10245b;border:4px solid #fff;border-radius:7px;padding:8px;overflow:auto}.cmd button{display:block;width:100%;font-size:16px}
#msg{font-size:16px;line-height:1.5}.float{position:absolute;z-index:90;font:bold 24px monospace;text-shadow:2px 2px #000;animation:float .7s forwards}@keyframes float{to{transform:translateY(-55px);opacity:0}}
#overlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.84);align-items:center;justify-content:center;text-align:center}
#overlay.show{display:flex}.card{background:#10245b;border:5px solid #fff;padding:25px;max-width:720px;min-width:330px}
.big{font-size:42px;font-weight:900;color:#fff59d;text-shadow:3px 3px #b22}.victoryParty{display:flex;justify-content:center;align-items:flex-end;gap:8px;height:190px}
.victoryParty img{max-height:190px;max-width:170px;object-fit:contain;image-rendering:pixelated;animation:cheer .34s steps(2) 6;transform-origin:bottom center}.victoryParty img:nth-child(2){animation-name:cheerHorse}.victoryParty img:nth-child(3){animation-delay:.08s}.victoryParty img:nth-child(4){animation-delay:.16s}@keyframes cheer{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-14px) rotate(3deg)}}@keyframes cheerHorse{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(-3deg)}}
.small{font-size:12px;color:#ddd}
</style><style>

@media(max-width:600px){#galleryGrid{grid-template-columns:repeat(2,1fr)}#rewardHistoryBtn{width:100%;margin-top:6px}}
</style>
<style id="mobile-v3">

@media(max-width:700px){body{background:#28203a}#game{padding:6px;min-height:100%}h1{font-size:16px;text-align:center}.bar{font-size:11px;padding:5px;gap:5px}#rewardHistoryBtn{width:auto!important;margin-left:auto!important;font-size:11px;padding:6px 8px}#map{border-width:3px}#hero{width:44px;height:52px}.controls{margin:12px 0 8px}.controls button{min-width:58px;min-height:58px;font-size:25px;padding:8px;margin:3px}.small{font-size:12px;line-height:1.35;padding:0 6px 8px}#battle{padding:3px;overflow:auto}.battlebox{width:100%!important;height:calc(100dvh - 6px)!important;min-height:620px;border-width:3px!important}#battleTitle{padding:4px 8px!important}#battleTitle b{font-size:17px!important}#areaTag{font-size:11px!important;padding:5px 8px!important}#party{left:1%!important;width:31%!important;top:11%!important;height:56%!important}#party .actor{width:100px!important;height:92px!important}#party .actor.attack{transform:translateX(72px) scale(1.05)!important}#enemies{left:34%!important;right:1%!important;top:22%!important;bottom:34%!important;gap:2px!important}.enemy{width:25%!important;height:80%!important;font-size:9px!important}.enemy span{font-size:9px!important;padding:2px!important}#ui{height:31%!important;grid-template-columns:34% 66%!important}.panel{padding:4px!important;border-width:3px!important}.cmd button{font-size:13px!important;padding:7px 4px 7px 10px!important}#status,#msg{font-size:10px!important;line-height:1.3}.card{width:94vw!important;min-width:0!important;max-height:92dvh;overflow:auto;padding:14px}.big{font-size:28px}.victoryParty{height:150px}.victoryParty img{max-height:145px;max-width:120px}#rewardFrame{width:96vw;height:88dvh}#rewardTop{padding:10px 12px}#rewardTop b{font-size:24px}#rewardText{font-size:15px;left:8px;right:8px;bottom:8px;padding:9px}#galleryPanel{width:97vw;height:90dvh}#galleryHead{font-size:19px}#galleryTabs button{font-size:11px;padding:7px}#galleryGrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:7px}}

</head><body><div id="rewardCG" onclick="closeReward()"><div id="rewardFrame">
<img id="rewardImg"><div id="rewardTop"><b>KAMADOYA LEVEL UP!</b><br><span id="rewardLv"></span></div>

</div></div><div id="game">
<h1>OASIS QUEST β3.0 MOBILE EDITION — MULTI BATTLE</h1>
<div class="bar"><span id="coord"></span><span id="lead"></span><span id="partyText"></span><button id="rewardHistoryBtn" type="button">★ REWARD HISTORY</button></div>
<div id="map"><div id="tileLayer"></div><img id="hero" src="assets/kamadoya_field.png"></div>
<div class="controls"><button onclick="step(0,-1)">▲</button><br><button onclick="step(-1,0)">◀</button><button onclick="step(1,0)">▶</button><br><button onclick="step(0,1)">▼</button></div>

 <div id="galleryPanel">
  <div id="galleryHead"><b>REWARD HISTORY</b><button id="galleryClose" type="button">×</button></div>
  <div id="galleryTabs">
   <button type="button" data-char="KAMADOYA">KAMADOYA</button>

 </div>

<div id="battle"><div class="battlebox"><div id="battleTitle"><b>OASIS QUEST</b><small>— Hunt. Grow. Explore. —</small></div><div id="areaTag">Desert Oasis</div><div id="enemies"></div><div id="party"></div>
<div id="ui"><div class="panel cmd"><button id="attackBtn">ATTACK</button><button disabled>MAGIC</button><button disabled>ITEM</button><button id="runBtn">RUN</button></div>
<div class="panel"><div id="status"></div><hr><div id="msg">Battle!</div></div></div></div></div>
<div id="overlay"><div class="card"><div id="ovTitle" class="big"></div><div id="ovParty" class="victoryParty"></div><div id="ovBody"></div><br><button id="ovBtn">OK</button></div></div>

<script>
const A="assets/";
const chars={
"KAMADOYA":{join:1,lv:1,exp:0,hp:32,mp:12,maxhp:32,maxmp:12,atk:7,def:4,agi:5,
 field:A+"kamadoya_field2.png",battle:A+"kamadoya_battle.png",victory:A+"kamadoya_victory2.png"},
"Uma-chan":{join:4,lv:1,exp:0,hp:24,mp:6,maxhp:24,maxmp:6,atk:5,def:3,agi:8,
 battle:A+"uma_battle.png",victory:A+"uma_victory2.png"},
"Doowee":{join:6,lv:1,exp:0,hp:34,mp:14,maxhp:34,maxmp:14,atk:6,def:6,agi:3,
 battle:A+"doowee_battle.png",victory:A+"doowee_victory2.png"},
"Naughty":{join:8,lv:1,exp:0,hp:30,mp:8,maxhp:30,maxmp:8,atk:9,def:4,agi:6,
 battle:A+"naughty_battle.png",victory:A+"naughty_victory2.png"}};



const partyRewardMessages={
 "KAMADOYA":["Another step forward! ♥"],
 "Uma-chan":["Tiny hooves, big adventures! ♥","Always by your side! ♥"],
 "Doowee":["A steady shield for the journey! ♥","Good food, good company, greater journeys! ♥"],
 "Naughty":["Stronger raids, brighter tomorrows! ♥","More battles, more victories... and more fun ahead! ♥"]
};
let pendingPartyRewards=[];
const unlockedRewards={"KAMADOYA":new Set(),"Uma-chan":new Set(),"Doowee":new Set(),"Naughty":new Set()};
let rewardSequenceActive=false;
let galleryCharacter="KAMADOYA";
function unlockReward(name,lv){if(unlockedRewards[name])unlockedRewards[name].add(Math.min(20,Math.max(1,lv)))}

function partyRewardPath(name,lv){
 let n=Math.min(20,Math.max(1,lv));
 if(name==="KAMADOYA") return A+"rewards/lv"+n+".jpg";
 let folder=name==="Uma-chan"?"umachan":name.toLowerCase();
 return A+"rewards/"+folder+"/lv"+n+".jpg";
}
function queuePartyReward(name,lv){
 unlockReward(name,lv);
 pendingPartyRewards.push({name,lv});
}
function showNextPartyReward(){
 if(!pendingPartyRewards.length){rewardSequenceActive=false;return;}
 rewardSequenceActive=true;
 let r=pendingPartyRewards.shift();
 document.getElementById("rewardImg").src=partyRewardPath(r.name,r.lv);
 document.getElementById("rewardLv").textContent=r.name+" — Lv "+r.lv+" REWARD";
 let m=partyRewardMessages[r.name]||["LEVEL UP! ♥"];
 document.getElementById("rewardMsg").textContent=m[(r.lv-1)%m.length];
 document.getElementById("rewardCG").classList.add("show");
}

const rewardMessages=['Thank you for playing! ♥',"You're doing great! ♥",'Keep going! I believe in you! ♥','A new place, a new adventure! ♥','Beautiful memories! ♥','The world is full of wonders! ♥','A little reward for your hard work! ♥',"You've grown so strong! ♥",'Take a break and relax... ♥','Sweet dreams... ♥','Good morning! More adventures await! ♥',"Let's capture more memories! ♥",'Even in the cold, you keep going! ♥','Every step is a new story! ♥','Cheers to your progress! ♥','Happy Holidays! Thank you always! ♥',"You're amazing! Keep shining! ♥",'So close... You can do it! ♥','Almost there... Just a little more! ♥',"Thank you for everything! Let's continue this journey... ♥"]
let pendingRewardLevel=null;
function rewardPath(lv){let n=Math.min(20,Math.max(1,lv));return A+"rewards/lv"+n+".jpg"}
function showKamadoyaReward(lv){
 unlockReward("KAMADOYA",lv); rewardSequenceActive=true;
 pendingRewardLevel=null;
 document.getElementById("rewardImg").src=rewardPath(lv);
 document.getElementById("rewardLv").textContent="Lv "+lv+" REWARD";
 document.getElementById("rewardMsg").textContent=rewardMessages[Math.min(19,Math.max(0,lv-1))]+" ♥";
 document.getElementById("rewardCG").classList.add("show");
}
function closeReward(){
 document.getElementById("rewardCG").classList.remove("show");
 if(pendingPartyRewards.length){
   setTimeout(showNextPartyReward,140);
   return;
 }
 rewardSequenceActive=false;
 moving=false;
 if(!document.getElementById("battle").classList.contains("show")) inBattle=false;
 render();
}

const battleSprites={
"KAMADOYA":{idle:[A+"kamadoya_battle_fixed.png",A+"kamadoya_battle_fixed.png"],attack:[A+"kamadoya_battle_fixed.png",A+"kamadoya_battle_fixed.png"]},
"Uma-chan":{idle:[A+"umachan_battle_fixed.png",A+"umachan_battle_fixed.png"],attack:[A+"umachan_battle_fixed.png",A+"umachan_battle_fixed.png"]},
"Doowee":{idle:[A+"doowee_battle_fixed.png",A+"doowee_battle_fixed.png"],attack:[A+"doowee_battle_fixed.png",A+"doowee_battle_fixed.png"]},
"Naughty":{idle:[A+"naughty_battle_fixed.png",A+"naughty_battle_fixed.png"],attack:[A+"naughty_battle_fixed.png",A+"naughty_battle_fixed.png"]}};
let idleTick=0,idleTimer=null;
function startPartyIdle(){clearInterval(idleTimer);idleTimer=setInterval(()=>{idleTick++;active().forEach(n=>{let e=actorEl(n),s=battleSprites[n];if(e&&!e.classList.contains("attack"))e.src=s.idle[idleTick%s.idle.length]})},260)}
function stopPartyIdle(){clearInterval(idleTimer)}
async function playAttackFrames(n){let e=actorEl(n),s=battleSprites[n];if(!e)return;e.classList.add("attack");for(const f of s.attack){e.src=f;await wait(75)}await wait(70);e.classList.remove("attack");e.src=s.idle[0]}

const enemyDB={
"Rat":[8,2,4],"Spider":[13,4,7],"Snake":[19,6,10],"Bat":[22,7,12],"Wild Boar":[32,9,16],
"Wolf":[40,11,20],"Bear":[56,14,28],"Crocodile":[70,17,36],"Tiger":[86,20,46],"Elephant":[120,25,65]};
let x=20,y=50,moving=false,inBattle=false,enemies=[],target=0,levelQueue=[],joinQueue=[];const joinedShown={"Uma-chan":false,"Doowee":false,"Naughty":false};
const map=document.getElementById("map"),hero=document.getElementById("hero"),tileLayer=document.getElementById("tileLayer");
function active(){return Object.entries(chars).filter(([n,c])=>n==="KAMADOYA"||chars.KAMADOYA.lv>=c.join).map(x=>x[0])}
function need(lv){return Math.max(4,Math.round((20+(lv-1)*18+(lv-1)*(lv-1)*6)/6))}
function hash(a,b){let n=(a*374761393+b*668265263)^0x5bf03635;n=(n^(n>>13))*1274126177;return ((n^(n>>16))>>>0)/4294967295}
function oasisAt(a,b){if(a===20&&b===50)return false;let d=Math.abs(a-20)+Math.abs(b-50);return hash(a,b)<(.20-Math.min(.07,d/900))}
function terrain(a,b){if(a===20&&b===50)return"village";if(oasisAt(a,b))return"oasis";let r=hash(a+200,b-300);return r<.08?"water":r<.18?"mountain":r<.35?"forest":r<.43?"desert":"plain"}
function fieldLayout(){
 const mobile=window.innerWidth<=700; const cols=mobile?7:11,rows=mobile?7:9; const ts=mobile?Math.max(42,Math.floor((window.innerWidth-18)/cols)):64; return {mobile,cols,rows,ts,cx:Math.floor(cols/2),cy:Math.floor(rows/2)};
}
function render(){
 const L=fieldLayout(); map.style.setProperty("--ts",L.ts+"px"); map.style.width=(L.cols*L.ts)+"px";map.style.height=(L.rows*L.ts)+"px"; tileLayer.innerHTML="";tileLayer.style.transform="translate(0px,0px)";tileLayer.style.transition="none";
 for(let j=-L.cy;j<=L.cy;j++)for(let i=-L.cx;i<=L.cx;i++){let a=x+i,b=y+j,t=document.createElement("div");t.className="tile "+terrain(a,b);t.style.left=(i+L.cx)*L.ts+"px";t.style.top=(j+L.cy)*L.ts+"px";t.onclick=()=>{if(Math.abs(i)+Math.abs(j)===1)step(Math.sign(i),Math.sign(j))};tileLayer.appendChild(t)}
 hero.style.left="50%";hero.style.top="50%"; document.getElementById("coord").textContent=`(${x}|${y})`; let k=chars.KAMADOYA;document.getElementById("lead").textContent=`KAMADOYA Lv${k.lv} EXP ${k.exp}/${need(k.lv)} HP ${k.hp}/${k.maxhp}`;document.getElementById("partyText").textContent="Party: "+active().map(n=>n+" Lv"+chars[n].lv).join(" / ");
}
function step(dx,dy){
 if(moving||inBattle||Math.abs(dx)+Math.abs(dy)!==1)return;
 let nx=Math.max(0,Math.min(99,x+dx)),ny=Math.max(0,Math.min(99,y+dy));if(nx===x&&ny===y)return;
 moving=true;hero.classList.add("walk");
 tileLayer.style.transition="transform .34s linear";
 const L=fieldLayout();tileLayer.style.transform=`translate(${-dx*L.ts}px,${-dy*L.ts}px)`;
 setTimeout(()=>{x=nx;y=ny;moving=false;hero.classList.remove("walk");render();if(oasisAt(x,y))setTimeout(startBattle,100)},350)
}
window.addEventListener("resize",()=>{if(!moving&&!inBattle)render()});
document.addEventListener("keydown",e=>{if(e.key==="ArrowUp")step(0,-1);if(e.key==="ArrowDown")step(0,1);if(e.key==="ArrowLeft")step(-1,0);if(e.key==="ArrowRight")step(1,0)});
function pool(){let d=Math.abs(x-20)+Math.abs(y-50);if(d<10)return["Rat","Spider"];if(d<22)return["Rat","Spider","Snake","Bat"];if(d<38)return["Snake","Bat","Wild Boar","Wolf"];if(d<58)return["Wild Boar","Wolf","Bear","Crocodile"];return["Bear","Crocodile","Tiger","Elephant"]}
function count(){let r=Math.random();return r<.30?1:r<.58?2:r<.82?3:4} // 70% chance of multiple enemies
function startBattle(){
 inBattle=true;let p=pool(),n=count();enemies=[];
 for(let i=0;i<n;i++){let name=p[Math.floor(Math.random()*p.length)],d=enemyDB[name];enemies.push({name,hp:d[0],maxhp:d[0],atk:d[1],exp:d[2],alive:true,id:i})}
 target=0;document.getElementById("battle").classList.add("show");drawBattle();msg(`<b>${n} ${n===1?"enemy":"enemies"} appeared!</b>`)
}
function drawBattle(){
 let box=document.getElementById("enemies");box.innerHTML="";
 enemies.forEach((e,i)=>{if(!e.alive)return;let b=document.createElement("button");b.className="enemy "+(i===target?"sel":"");b.dataset.id=i;b.onclick=()=>{target=i;drawBattle()};b.innerHTML=`<img src="${A+"enemy_"+e.name.toLowerCase().replaceAll(" ","_")+".png"}"><span>${e.name}<br>HP ${Math.max(0,e.hp)}/${e.maxhp}</span>`;box.appendChild(b)});
 let pp=document.getElementById("party");pp.innerHTML="";active().forEach(n=>{let im=document.createElement("img");im.className="actor";im.id="actor-"+n.replace(/[^A-Za-z]/g,"");im.src=battleSprites[n].idle[0];im.title=n;im.alt=n;pp.appendChild(im)});startPartyIdle();
 document.getElementById("status").innerHTML=active().map(n=>{let c=chars[n];return `<b>${n}</b> Lv${c.lv} HP ${c.hp}/${c.maxhp} MP ${c.mp}/${c.maxmp} EXP ${c.exp}/${need(c.lv)}`}).join("<br>");
}
function msg(s){document.getElementById("msg").innerHTML=s}
function firstAlive(){return enemies.findIndex(e=>e.alive)}
function actorEl(n){return document.getElementById("actor-"+n.replace(/[^A-Za-z]/g,""))}
function enemyEl(id){return document.querySelector(`.enemy[data-id="${id}"]`)}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function floater(text,el){let f=document.createElement("div");f.className="float";f.textContent=text;let r=el?.getBoundingClientRect()||{left:innerWidth/2,top:innerHeight/2};f.style.left=(r.left+r.width/2)+"px";f.style.top=(r.top+20)+"px";document.body.appendChild(f);setTimeout(()=>f.remove(),720)}
async function partyAttack(n){
 if(!enemies.some(e=>e.alive))return;if(!enemies[target]?.alive)target=firstAlive();
 let e=enemies[target],ae=actorEl(n),ee=enemyEl(e.id),c=chars[n];
 await playAttackFrames(n);
 let dmg=Math.max(1,c.atk+c.lv*2+Math.floor(Math.random()*4)-Math.floor(e.atk/4));
 e.hp-=dmg;ee?.classList.add("hit");floater("-"+dmg,ee);msg(`<b>${n}</b> attacks ${e.name}! ${dmg} damage!`);
 await wait(180);
 if(e.hp<=0){e.alive=false;ee?.classList.add("dead");await wait(260);target=firstAlive()}drawBattle();await wait(180)
}
async function attackRound(){
 document.getElementById("attackBtn").disabled=true;
 for(const n of active()){if(!enemies.some(e=>e.alive))break;await partyAttack(n)}
 if(!enemies.some(e=>e.alive)){victory();return}
 for(const e of enemies.filter(q=>q.alive)){
   let live=active().filter(n=>chars[n].hp>0);if(!live.length){defeat();return}
   let n=live[Math.floor(Math.random()*live.length)],c=chars[n],ae=actorEl(n),dmg=Math.max(1,e.atk-Math.floor(c.def/2)+Math.floor(Math.random()*3));
   c.hp=Math.max(0,c.hp-dmg);let ee=enemyEl(e.id);ee?.classList.add("enemyAttack");await wait(260);ae?.classList.add("hurt");floater("-"+dmg,ae);msg(`${e.name} attacks <b>${n}</b>! ${dmg} damage!`);await wait(360);ae?.classList.remove("hurt");ee?.classList.remove("enemyAttack");drawBattle();
 }
 if(active().every(n=>chars[n].hp<=0)){defeat();return}document.getElementById("attackBtn").disabled=false
}
document.getElementById("attackBtn").onclick=attackRound;
document.getElementById("runBtn").onclick=()=>{if(Math.random()<.65){inBattle=false;stopPartyIdle();document.getElementById("battle").classList.remove("show");render()}else msg("Couldn't escape!")};
function victory(){
 let total=enemies.reduce((s,e)=>s+e.exp,0),n=enemies.length,rate=n===1?0:n===2?.10:n===3?.20:.30,bonus=Math.round(total*rate),gain=total+bonus,gold=Math.round(gain*1.4);
 levelQueue=[];
 active().forEach(name=>{let c=chars[name];c.exp+=gain;while(c.exp>=need(c.lv)){let old={lv:c.lv,hp:c.maxhp,mp:c.maxmp,atk:c.atk,def:c.def};c.exp-=need(c.lv);c.lv++;c.maxhp+=5+Math.floor(Math.random()*4);c.maxmp+=2+Math.floor(Math.random()*3);c.atk+=2;c.def+=1;c.agi+=1;c.hp=c.maxhp;c.mp=c.maxmp;levelQueue.push({name,old,newv:{lv:c.lv,hp:c.maxhp,mp:c.maxmp,atk:c.atk,def:c.def}});if(name==="KAMADOYA"){[["Uma-chan",4],["Doowee",6],["Naughty",8]].forEach(([jn,jl])=>{if(c.lv>=jl&&!joinedShown[jn]&&!joinQueue.includes(jn))joinQueue.push(jn)})}}})
 showVictory(gain,gold,bonus,rate)
}
function showVictory(gain,gold,bonus,rate){
 let ov=document.getElementById("overlay"),vp=document.getElementById("ovParty");vp.innerHTML="";active().forEach(n=>{let im=document.createElement("img");im.src=chars[n].victory;vp.appendChild(im)});
 document.getElementById("ovTitle").textContent="VICTORY!";
 document.getElementById("ovBody").innerHTML=`+${gain} EXP · +${gold} Gold`+(bonus?`<br><b>MULTI BATTLE BONUS! EXP +${Math.round(rate*100)}% (+${bonus})</b>`:"");
 ov.classList.add("show");document.getElementById("ovBtn").onclick=nextResult
}
function nextResult(){
 if(levelQueue.length){let q=levelQueue.shift(),n=q.name,c=chars[n],o=q.old,v=q.newv;
 for(let rewardLv=o.lv;rewardLv<=v.lv;rewardLv++){
   if(!unlockedRewards[n].has(rewardLv)) queuePartyReward(n,rewardLv);
 }document.getElementById("ovTitle").textContent=n.toUpperCase()+" LEVEL UP!";document.getElementById("ovParty").innerHTML=`<img src="${c.victory}" alt="${n} victory">`;document.getElementById("ovBody").innerHTML=`<b>Lv ${o.lv} → ${v.lv}</b><br>HP ${o.hp} → ${v.hp} <span style="color:#7dff78">(+${v.hp-o.hp})</span> · MP ${o.mp} → ${v.mp} <span style="color:#7dff78">(+${v.mp-o.mp})</span><br>Attack ${o.atk} → ${v.atk} <span style="color:#7dff78">(+${v.atk-o.atk})</span> · Defense ${o.def} → ${v.def} <span style="color:#7dff78">(+${v.def-o.def})</span>`;return}
 if(joinQueue.length){let n=joinQueue.shift();joinedShown[n]=true;let c=chars[n];document.getElementById("ovTitle").textContent=n.toUpperCase()+" JOINED THE PARTY!";document.getElementById("ovParty").innerHTML=`<img src="${c.victory}" alt="${n} joins">`;document.getElementById("ovBody").innerHTML=`<div style="font-size:24px">★ ✦ NEW COMPANION ✦ ★</div><br>`+active().map(q=>`<b>${q}</b>`).join(" · ");return}document.getElementById("overlay").classList.remove("show");stopPartyIdle();document.getElementById("battle").classList.remove("show");inBattle=false;moving=false;document.getElementById("attackBtn").disabled=false;moving=false;render();if(pendingPartyRewards.length)setTimeout(showNextPartyReward,80)
}
function defeat(){
 msg("<b>DEFEATED...</b><br>Returning to KAMADOYA's Village.");
 setTimeout(()=>{x=20;y=50;active().forEach(n=>{chars[n].hp=chars[n].maxhp;chars[n].mp=chars[n].maxmp});stopPartyIdle();document.getElementById("battle").classList.remove("show");inBattle=false;document.getElementById("attackBtn").disabled=false;moving=false;render()},900)
}
render();
</script>

<style>
@keyframes partyIdleAlive{
  0%,100%{transform:translateY(0) scale(1)}
  35%{transform:translateY(-3px) scale(1.015)}
  65%{transform:translateY(1px) scale(.995)}
}
@keyframes partyStrike{
  0%{transform:translateX(0) translateY(0) scale(1)}
  18%{transform:translateX(22px) translateY(-5px) rotate(-3deg) scale(1.03)}
  48%{transform:translateX(150px) translateY(-8px) rotate(4deg) scale(1.10)}
  62%{transform:translateX(158px) translateY(0) rotate(-5deg) scale(1.07)}
  100%{transform:translateX(0) translateY(0) rotate(0) scale(1)}
}
@keyframes enemyIdleAlive{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
@keyframes enemyStrike{
  0%{transform:translateX(0) scale(1)}
  35%{transform:translateX(-30px) scale(1.03)}
  58%{transform:translateX(-110px) scale(1.10)}
  72%{transform:translateX(-118px) scale(.98)}
  100%{transform:translateX(0) scale(1)}
}
@keyframes battleHit{
  0%,100%{filter:brightness(1)}
  25%{filter:brightness(2.4)}
  50%{filter:brightness(.55)}
  75%{filter:brightness(2)}
}
#party .actor{animation:partyIdleAlive 1.05s steps(2,end) infinite;transform-origin:50% 90%}
#party .actor.attack{animation:partyStrike .48s cubic-bezier(.25,.8,.3,1) 1!important}
#party .actor.hurt{animation:battleHit .32s steps(2,end) 1!important}
.enemy{animation:enemyIdleAlive 1.2s steps(2,end) infinite;transform-origin:50% 90%}
.enemy.enemyAttack{animation:enemyStrike .46s cubic-bezier(.25,.8,.3,1) 1!important}
.enemy.hurt{animation:battleHit .32s steps(2,end) 1!important}
.slashFX{position:absolute;z-index:50;width:76px;height:76px;pointer-events:none;
 border-top:7px solid #fff4a8;border-right:7px solid #fff;border-radius:50%;
 transform:rotate(35deg);filter:drop-shadow(0 0 8px #ff9d22);animation:slashPop .28s ease-out forwards}
@keyframes slashPop{0%{opacity:0;transform:scale(.35) rotate(10deg)}
 45%{opacity:1;transform:scale(1.2) rotate(45deg)}

</style>
<script>
(function(){
 const oldShowLevelUp=window.showLevelUp;
 if(typeof oldShowLevelUp==="function"){
   window.showLevelUp=function(q){
     if(q && q.name && q.name!=="KAMADOYA" && q.newLv) queuePartyReward(q.name,q.newLv);
     return oldShowLevelUp(q);
   };
 }
})();
</script><script>
const rewardGallery=document.getElementById("rewardGallery");
const galleryGrid=document.getElementById("galleryGrid");
const galleryCount=document.getElementById("galleryCount");
function renderRewardGallery(){
 const set=unlockedRewards[galleryCharacter]||new Set();
 galleryCount.textContent=galleryCharacter+" — "+set.size+" / 20 unlocked";
 galleryGrid.innerHTML="";
 for(let lv=1;lv<=20;lv++){
   const card=document.createElement("div");card.className="rewardThumb";
   if(set.has(lv)){
     const btn=document.createElement("button");btn.type="button";
     const img=document.createElement("img");img.src=partyRewardPath(galleryCharacter,lv);img.alt=galleryCharacter+" Lv "+lv+" reward";
     const b=document.createElement("b");b.textContent="Lv "+lv;
     btn.append(img,b);
     btn.addEventListener("click",()=>openGalleryPreview(galleryCharacter,lv));
     card.appendChild(btn);
   }else{
     card.innerHTML='<div class="rewardLocked">?</div><b>Lv '+lv+' — LOCKED</b>';
   }
   galleryGrid.appendChild(card);
 }
 document.querySelectorAll("#galleryTabs button").forEach(b=>b.classList.toggle("active",b.dataset.char===galleryCharacter));
}
function openRewardGallery(){
 rewardGallery.classList.add("show");rewardGallery.setAttribute("aria-hidden","false");renderRewardGallery();
}
function closeRewardGallery(){rewardGallery.classList.remove("show");rewardGallery.setAttribute("aria-hidden","true")}
function openGalleryPreview(name,lv){
 let old=document.getElementById("galleryPreview");if(old)old.remove();
 let pv=document.createElement("div");pv.id="galleryPreview";pv.className="show";
 let img=document.createElement("img");img.src=partyRewardPath(name,lv);img.alt=name+" Lv "+lv+" reward";
 pv.appendChild(img);pv.addEventListener("click",()=>pv.remove());document.body.appendChild(pv);
}
document.getElementById("rewardHistoryBtn").addEventListener("click",openRewardGallery);
document.getElementById("galleryClose").addEventListener("click",closeRewardGallery);
document.querySelectorAll("#galleryTabs button").forEach(b=>b.addEventListener("click",()=>{galleryCharacter=b.dataset.char;renderRewardGallery()}));
</script></body></html>
